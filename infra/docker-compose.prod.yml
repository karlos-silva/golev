services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./caddy/certs:/etc/caddy/certs:ro
      - caddy_data:/data
    networks:
      - default
      - web_edge
    depends_on:
      - web
      - api
    restart: unless-stopped

  web:
    image: ghcr.io/${GHCR_OWNER:-tria-nox}/${PRODUCT_NAME:-saas}-web:${IMAGE_TAG:-latest}
    env_file: .env
    depends_on:
      - api
    restart: unless-stopped

  api:
    image: ghcr.io/${GHCR_OWNER:-tria-nox}/${PRODUCT_NAME:-saas}-api:${IMAGE_TAG:-latest}
    env_file: .env
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    # Publica APENAS no loopback do VPS (não na internet) — acesso via túnel SSH.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

networks:
  web_edge:
    external: true

volumes:
  pgdata:
  caddy_data:
  uploads:
