name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Branch, tag ou SHA para build (ex.: main, feature/x)'
        required: true
        default: 'main'
      target:
        description: 'Ambiente de deploy'
        required: true
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
  PRODUCT_NAME: saas

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      deploy_tag: ${{ steps.meta.outputs.deploy_tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.git_ref || github.sha }}

      - name: Set image tags
        id: meta
        run: |
          PREFIX="${IMAGE_PREFIX}/${PRODUCT_NAME}"
          SHA="${GITHUB_SHA}"
          EVENT="${{ github.event_name }}"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            TARGET="${{ inputs.target }}"
            if [ "$TARGET" = "staging" ]; then
              TAG="stg-${{ github.run_id }}"
              echo "api_tags=${PREFIX}-api:${TAG},${PREFIX}-api:${SHA}" >> "$GITHUB_OUTPUT"
              echo "web_tags=${PREFIX}-web:${TAG},${PREFIX}-web:${SHA}" >> "$GITHUB_OUTPUT"
              echo "deploy_tag=${TAG}" >> "$GITHUB_OUTPUT"
              echo "infisical_env=staging" >> "$GITHUB_OUTPUT"
            else
              echo "api_tags=${PREFIX}-api:latest,${PREFIX}-api:${SHA}" >> "$GITHUB_OUTPUT"
              echo "web_tags=${PREFIX}-web:latest,${PREFIX}-web:${SHA}" >> "$GITHUB_OUTPUT"
              echo "deploy_tag=latest" >> "$GITHUB_OUTPUT"
              echo "infisical_env=prod" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "api_tags=${PREFIX}-api:latest,${PREFIX}-api:${SHA}" >> "$GITHUB_OUTPUT"
            echo "web_tags=${PREFIX}-web:latest,${PREFIX}-web:${SHA}" >> "$GITHUB_OUTPUT"
            echo "deploy_tag=latest" >> "$GITHUB_OUTPUT"
            echo "infisical_env=prod" >> "$GITHUB_OUTPUT"
          fi
        env:
          IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
          PRODUCT_NAME: saas

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.api_tags }}

      # Busca os NEXT_PUBLIC_* do Infisical e injeta como env vars do job.
      # São build-time: precisam estar presentes no `next build`.
      - name: Fetch build secrets from Infisical
        uses: Infisical/secrets-action@v1.0.12
        with:
          method: 'universal'
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ steps.meta.outputs.infisical_env }}
          domain: 'https://app.infisical.com'

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.web
          push: true
          tags: ${{ steps.meta.outputs.web_tags }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ env.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ env.NEXT_PUBLIC_POSTHOG_HOST }}

  deploy-staging:
    needs: build-and-push
    if: >-
      needs.build-and-push.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'staging' &&
      secrets.VPS_HOST != '' &&
      secrets.VPS_USER != '' &&
      secrets.VPS_SSH_KEY != ''
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy to staging
        uses: appleboy/ssh-action@v1
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: INFISICAL_CLIENT_ID,INFISICAL_CLIENT_SECRET,INFISICAL_PROJECT_ID
          script: |
            set -euo pipefail
            cd ~/apps/${{ env.PRODUCT_NAME }}/staging
            export IMAGE_TAG="${{ needs.build-and-push.outputs.deploy_tag }}"
            # Gera o .env (que o compose consome via env_file) a partir do Infisical
            INFISICAL_TOKEN="$(infisical login --method=universal-auth \
              --client-id="$INFISICAL_CLIENT_ID" \
              --client-secret="$INFISICAL_CLIENT_SECRET" --plain --silent)"
            infisical export --token="$INFISICAL_TOKEN" \
              --projectId="$INFISICAL_PROJECT_ID" --env=staging --format=dotenv > .env
            docker compose pull
            docker compose run --rm api npx drizzle-kit migrate
            docker compose up -d --remove-orphans

  deploy-production:
    needs: build-and-push
    if: >-
      needs.build-and-push.result == 'success' &&
      secrets.VPS_HOST != '' &&
      secrets.VPS_USER != '' &&
      secrets.VPS_SSH_KEY != '' &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AUTO_DEPLOY_PRODUCTION_ON_MAIN == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.target == 'production')
      )
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: INFISICAL_CLIENT_ID,INFISICAL_CLIENT_SECRET,INFISICAL_PROJECT_ID
          script: |
            set -euo pipefail
            cd ~/apps/${{ env.PRODUCT_NAME }}/production
            export IMAGE_TAG=latest
            # Gera o .env (que o compose consome via env_file) a partir do Infisical
            INFISICAL_TOKEN="$(infisical login --method=universal-auth \
              --client-id="$INFISICAL_CLIENT_ID" \
              --client-secret="$INFISICAL_CLIENT_SECRET" --plain --silent)"
            infisical export --token="$INFISICAL_TOKEN" \
              --projectId="$INFISICAL_PROJECT_ID" --env=prod --format=dotenv > .env
            docker compose pull
            docker compose run --rm api npx drizzle-kit migrate
            docker compose up -d --remove-orphans
