name: Preview

# Preview efêmero opt-in: só roda quando a label `preview` é adicionada ao PR
# (ou em novos commits de um PR que já tem a label). Derruba ao tirar a label / fechar o PR.
on:
  pull_request:
    types: [labeled, unlabeled, synchronize, closed]

concurrency:
  group: preview-slot
  cancel-in-progress: true

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
  PRODUCT_NAME: golev-plataform

jobs:
  deploy-preview:
    if: >-
      (github.event.action == 'labeled' && github.event.label.name == 'preview') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'preview'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image (preview)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/${{ env.PRODUCT_NAME }}-api:preview

      - name: Build & push Web image (preview)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.web
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/${{ env.PRODUCT_NAME }}-web:preview
          build-args: |
            NEXT_PUBLIC_API_URL=https://api-preview.golev.app.br
            NEXT_PUBLIC_SITE_URL=https://preview.golev.app.br

      - name: Deploy preview on VPS
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            set -euo pipefail
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd /root/apps/golev-plataform/preview
            docker compose pull
            docker compose run --rm preview-api npx drizzle-kit migrate
            docker compose up -d --remove-orphans

      - name: Comment preview URL
        if: github.event.action == 'labeled'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '🔎 **Preview no ar:** https://preview.golev.app.br\nAPI: https://api-preview.golev.app.br\n\n_Slot único (banco isolado, descartável). Sai do ar ao remover a label `preview` ou fechar o PR._'
            })

  teardown-preview:
    if: >-
      (github.event.action == 'unlabeled' && github.event.label.name == 'preview') ||
      (github.event.action == 'closed' && contains(github.event.pull_request.labels.*.name, 'preview'))
    runs-on: ubuntu-latest
    steps:
      - name: Tear down preview on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /root/apps/golev-plataform/preview 2>/dev/null || exit 0
            docker compose down -v --remove-orphans || true
            echo "preview derrubado"
