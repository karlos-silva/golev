name: Preview

# Preview efêmero opt-in: só roda quando a label `preview` é adicionada ao PR
# (ou em novos commits de um PR que já tem a label). Derruba ao tirar a label / fechar o PR.
# Build no runner do GitHub; deploy/teardown no runner self-hosted (VPS, sem SSH).
on:
  pull_request:
    types: [labeled, unlabeled, synchronize, closed]

concurrency:
  group: preview-slot
  cancel-in-progress: true

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
  PRODUCT_NAME: golev-plataform

jobs:
  build-preview:
    if: >-
      (github.event.action == 'labeled' && github.event.label.name == 'preview') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'preview'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image (preview)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/${{ env.PRODUCT_NAME }}-api:preview

      - name: Build & push Web image (preview)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.web
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/${{ env.PRODUCT_NAME }}-web:preview
          build-args: |
            NEXT_PUBLIC_API_URL=https://api-preview.golev.app.br
            NEXT_PUBLIC_SITE_URL=https://preview.golev.app.br

  deploy-preview:
    needs: build-preview
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
      pull-requests: write
    steps:
      - name: Deploy preview (local na VPS)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          cd /opt/golev/preview
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker compose pull
          docker compose run --rm preview-api npx drizzle-kit migrate
          docker compose up -d --remove-orphans

      - name: Comment preview URL
        if: github.event.action == 'labeled'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '🔎 **Preview no ar:** https://preview.golev.app.br\nAPI: https://api-preview.golev.app.br\n\n_Slot único (banco isolado, descartável, noindex). Sai do ar ao remover a label `preview` ou fechar o PR._'
            })

  teardown-preview:
    if: >-
      (github.event.action == 'unlabeled' && github.event.label.name == 'preview') ||
      (github.event.action == 'closed' && contains(github.event.pull_request.labels.*.name, 'preview'))
    runs-on: self-hosted
    steps:
      - name: Tear down preview (local na VPS)
        run: |
          cd /opt/golev/preview 2>/dev/null || exit 0
          docker compose down -v --remove-orphans || true
          echo "preview derrubado"
